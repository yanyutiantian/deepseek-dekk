# DEKK 网页版脚本 —— 服务端 CORS 预检配置
#
# 背景：网页版脚本运行在 chat.deepseek.com 上，调用 https://dekk.example.com/API/ 属于跨域。
#   - GET（人设/插件列表、消息中心）是简单请求，只要响应带 Access-Control-Allow-Origin 就能读；
#   - POST（登录/注册/发验证码/改昵称…）带 Content-Type: application/json，
#     浏览器会先发 OPTIONS 预检，而 OPTIONS 在 nginx 里被静态处理直接 405，
#     PHP 根本收不到 → 预检失败 → 登录/注册全部失败。
#
# 放法：宝塔会把 extension/dekk.example.com/*.conf 包含在 server 块里，
#      所以这里可以安全地加 location 和 server 级 add_header，不碰面板生成的文件。
# 位置：/www/server/panel/vhost/nginx/extension/dekk.example.com/cors_preflight.conf

# 1) 预检直接 204（OPTIONS 走不进 PHP，只能在这里应答）
location = /API/ {
    if ($request_method = OPTIONS) {
        return 204;
    }
}

# 2) 所有响应都带上跨域头（含上面这个 204），避免依赖 PHP 那层的 header
add_header Access-Control-Allow-Origin $http_origin always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
add_header Access-Control-Max-Age 86400 always;
add_header Vary Origin always;
